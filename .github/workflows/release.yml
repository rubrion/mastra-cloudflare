# Every push to main: check, build, and let semantic-release read the commits
# since the last tag (Conventional Commits) to bump the version, tag it,
# publish to npm and write the GitHub release. fix → patch, feat → minor,
# a breaking change (! or BREAKING CHANGE) → major. npm trusts this workflow
# (trusted publishing, OIDC): no token, and the package gets provenance.
name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
concurrency: release
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
